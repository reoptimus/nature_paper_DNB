name: Tests

# These checks need no DNB Azure access and no confidential data - they run
# entirely on the reference/vulnerability data and synthetic demo dataset
# shipped in this repo (see README.md "What can run without DNB access").
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + dev/vulnerability-generation dependencies
        # Deliberately NOT installing the "azure" extra here: this proves the
        # package imports and runs its non-confidential functionality
        # without the azure SDK (see data_loader.py's lazy azure imports).
        run: pip install -e ".[dev,vulnerability-generation]"

      - name: Lint (ruff)
        run: python -m ruff check nature_analysis/

      - name: Tests + coverage
        # Runs test_import.py, test_suite.py (incl. the demo pipeline
        # end-to-end), test_visualization.py and test_vulnerability_generator.py.
        # Invoked as `python -m pytest` (not bare `pytest`) to avoid picking
        # up an unrelated pytest install earlier on PATH.
        run: python -m pytest --cov=nature_analysis --cov-report=term-missing --cov-fail-under=45 tests/
