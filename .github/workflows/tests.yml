name: Tests

# These tests need no DNB Azure access and no confidential data - they run
# entirely on the reference/vulnerability data and synthetic demo dataset
# shipped in this repo (see README.md "What can run without DNB access").
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install core + vulnerability-generation dependencies
        # Deliberately NOT installing azure-identity/azure-storage-file-datalake/
        # azure-core here: this proves the package imports and runs its
        # non-confidential functionality without them (see data_loader.py's
        # lazy azure imports).
        run: pip install pandas numpy scipy matplotlib seaborn joblib openpyxl scikit-learn pytest

      - name: Import + public API surface check
        run: python tests/test_import.py

      - name: Unit tests + demo pipeline end-to-end
        run: python tests/test_suite.py

      - name: Vulnerability-generator tests (pytest, mocked data)
        run: python -m pytest tests/test_vulnerability_generator.py -v
